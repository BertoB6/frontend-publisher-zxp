<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publisher ZonaXP — Mercado Gamer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      color: var(--texto);
      padding-bottom: 60px;
    }

    /* HEADER */
    header {
      background: rgba(10,10,26,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 16px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
    }
    .logo-linha {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-emoji {
      font-size: 28px;
    }
    .logo-texto h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primaria), var(--secundaria));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-texto p {
      font-size: 11.5px;
      color: rgba(255,255,255,0.5);
      margin-top: 1px;
    }

    .pesquisa {
      position: relative;
    }
    .pesquisa input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 14.5px;
      background: rgba(255,255,255,0.04);
      color: var(--texto);
      font-family: inherit;
      transition: all 0.2s;
    }
    .pesquisa input::placeholder {
      color: rgba(255,255,255,0.35);
    }
    .pesquisa input:focus {
      outline: none;
      border-color: var(--primaria);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 3px rgba(255,0,170,0.15);
    }
    .pesquisa-icone {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* CONTAINER */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ABAS */
    .abas {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .aba {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 9px;
      font-family: inherit;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }
    .aba.ativa {
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      box-shadow: 0 4px 14px rgba(255,0,170,0.3);
    }

    /* GRELHA */
    .grelha {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }
    @media (max-width: 480px) {
      .grelha {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }

    /* CARD JOGO */
    .card-jogo {
      background: var(--cards);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
      position: relative;
    }
    .card-jogo:hover {
      border-color: rgba(255,0,170,0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 20px rgba(255,0,170,0.15);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1/1;
      background: #0a0a1a center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(255,255,255,0.15);
      position: relative;
    }
    .card-tag-plataforma {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--secundaria);
      text-transform: uppercase;
    }
    .card-info {
      padding: 11px 12px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-nome {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 35px;
    }
    .card-rodape {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: auto;
    }
    .card-loja {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      min-width: 0;
      flex: 1;
      cursor: pointer;
      transition: color 0.15s;
    }
    .card-loja:hover {
      color: var(--secundaria);
    }
    .card-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08) center/cover no-repeat;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      overflow: hidden;
    }
    .card-loja-nome {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .card-likes {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      flex-shrink: 0;
      padding: 3px 7px;
      background: rgba(255,0,170,0.1);
      border-radius: 6px;
    }
    .card-likes .coracao {
      font-size: 10px;
    }

    /* VAZIO */
    .vazio {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.4);
    }
    .vazio-emoji {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .vazio-titulo {
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .vazio-txt {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.4);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--primaria);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* FOOTER */
    .rodape {
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,0.25);
      margin-top: 60px;
      padding: 20px;
      line-height: 1.8;
    }
    .rodape a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .rodape a:hover {
      color: var(--primaria);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-linha">
        <div class="logo-emoji">🎮</div>
        <div class="logo-texto">
          <h1>Publisher ZonaXP</h1>
          <p>O mercado gamer dos criadores</p>
        </div>
      </div>

      <div class="pesquisa">
        <span class="pesquisa-icone">🔍</span>
        <input type="text" id="pesquisaInput" placeholder="Pesquisar jogos, lojas...">
      </div>
    </div>
  </header>

  <div class="container">

    <div class="abas">
      <button class="aba ativa" id="abaRecentes" onclick="mudarAba('recentes')">🔥 Recentes</button>
      <button class="aba" id="abaPopulares" onclick="mudarAba('populares')">❤️ Populares</button>
    </div>

    <div id="conteudo">
      <div class="loading">
        <div class="spinner"></div>
        A carregar feed...
      </div>
    </div>

    <div class="rodape">
      <div>
        <a href="/login">Sou publisher</a> · 
        <a href="/pesquisa">Explorar</a>
      </div>
      <div style="margin-top: 6px;">© Publisher ZonaXP</div>
    </div>

  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO — URL da API
    // ============================================
    // LOCAL:      'http://localhost:3001'
    // PRODUÇÃO:   'https://publisher-zonaxp.onrender.com'
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    let ordemAtual = 'recentes';

    const conteudo = document.getElementById('conteudo');
    const pesquisaInput = document.getElementById('pesquisaInput');

    function escapar(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    /* ---------- Abas ---------- */
    function mudarAba(ordem) {
      ordemAtual = ordem;
      document.getElementById('abaRecentes').classList.toggle('ativa', ordem === 'recentes');
      document.getElementById('abaPopulares').classList.toggle('ativa', ordem === 'populares');
      carregarFeed();
    }

    /* ---------- Pesquisa ---------- */
    pesquisaInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = pesquisaInput.value.trim();
        if (q) window.location.href = '/pesquisa?q=' + encodeURIComponent(q);
      }
    });

    /* ---------- Feed ---------- */
    async function carregarFeed() {
      conteudo.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          A carregar feed...
        </div>
      `;

      try {
        const resp = await fetch(API_URL + '/api/publico/feed?ordem=' + ordemAtual);
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro('Erro ao carregar feed.');
          return;
        }

        if (!data.jogos || data.jogos.length === 0) {
          conteudo.innerHTML = `
            <div class="vazio">
              <div class="vazio-emoji">🎮</div>
              <div class="vazio-titulo">Ainda sem jogos</div>
              <div class="vazio-txt">Os publishers ainda não publicaram nada.<br>Volta em breve!</div>
            </div>
          `;
          return;
        }

        conteudo.innerHTML = `
          <div class="grelha">
            ${data.jogos.map(j => renderCard(j)).join('')}
          </div>
        `;
      } catch (e) {
        mostrarErro('Erro de ligação ao servidor.');
      }
    }

    function renderCard(j) {
      const avatarHtml = j.avatarLoja
        ? `<div class="card-avatar" style="background-image:url('${escapar(j.avatarLoja)}')"></div>`
        : `<div class="card-avatar">${escapar(j.nomeLoja).charAt(0).toUpperCase()}</div>`;

      const imgHtml = j.imagem
        ? `<div class="card-img" style="background-image:url('${escapar(j.imagem)}')"></div>`
        : `<div class="card-img">🎮</div>`;

      return `
        <div class="card-jogo" onclick="irParaJogo('${escapar(j.slug)}')">
          ${imgHtml}
          <div class="card-tag-plataforma">${escapar(j.plataforma)}</div>
          <div class="card-info">
            <div class="card-nome">${escapar(j.nome)}</div>
            <div class="card-rodape">
              <a class="card-loja" href="/loja/${escapar(j.slugLoja)}" onclick="event.stopPropagation()">
                ${avatarHtml}
                <span class="card-loja-nome">${escapar(j.nomeLoja)}</span>
              </a>
              <div class="card-likes">
                <span class="coracao">❤️</span>
                <span>${j.likes || 0}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function irParaJogo(slug) {
      window.location.href = '/jogo/' + slug;
    }

    function mostrarErro(msg) {
      conteudo.innerHTML = `
        <div class="vazio">
          <div class="vazio-emoji">⚠️</div>
          <div class="vazio-titulo">Erro</div>
          <div class="vazio-txt">${escapar(msg)}</div>
        </div>
      `;
    }

    /* ---------- Iniciar ---------- */
    carregarFeed();
  </script>
</body>
</html>
