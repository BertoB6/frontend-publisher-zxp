<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A carregar... — ZonaXP Publishers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      color: #1a1a1a;
      padding-bottom: 40px;
    }

    /* HEADER */
    .topo {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topo-brand {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.2px;
    }
    .topo-brand span {
      color: #999;
      font-weight: 500;
    }

    /* CONTAINER */
    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #eee;
      overflow: hidden;
    }

    /* IMAGEM GRANDE */
    .hero {
      width: 100%;
      aspect-ratio: 1/1;
      background: #f0f0f0 center/cover no-repeat;
      position: relative;
    }
    .hero-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: #ccc;
    }

    /* CONTEÚDO */
    .conteudo {
      padding: 22px 20px;
    }

    .tag-plataforma {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .categoria {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .desc-curta {
      font-size: 14.5px;
      color: #444;
      line-height: 1.5;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    /* INFO CARDS */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .info-item {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #f0f0f0;
    }
    .info-label {
      font-size: 11px;
      color: #999;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .info-valor {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      word-break: break-word;
    }

    /* DESCRIÇÃO LONGA */
    .desc-longa {
      background: #fafafa;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #f0f0f0;
      margin-bottom: 20px;
    }
    .desc-longa h3 {
      font-size: 12px;
      color: #999;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .desc-longa-conteudo {
      font-size: 14px;
      line-height: 1.65;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: inherit;
    }

    /* BOTÃO DOWNLOAD */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.2s;
      text-align: center;
      letter-spacing: -0.2px;
    }
    .btn-download:hover {
      background: #000;
      transform: translateY(-1px);
    }
    .btn-download:active {
      transform: translateY(0);
    }

    /* ERRO 404 */
    .erro-pagina {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #eee;
    }
    .erro-pagina .emoji {
      font-size: 56px;
      margin-bottom: 12px;
    }
    .erro-pagina h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .erro-pagina p {
      font-size: 14px;
      color: #888;
    }

    /* FOOTER */
    .rodape {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 24px;
      padding: 0 20px;
    }
    .rodape a {
      color: #666;
      text-decoration: none;
      font-weight: 600;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #999;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="topo">
    <div class="topo-brand">ZonaXP <span>Publishers</span></div>
  </div>

  <div class="container" id="app">
    <div class="loading">
      <div class="spinner"></div>
      A carregar jogo...
    </div>
  </div>

  <script>
    // Extrair slug do URL: /jogo/mortal-kombat-mod
    const partes = window.location.pathname.split('/').filter(Boolean);
    const slug = partes[partes.length - 1];

    const app = document.getElementById('app');

    function escapar(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function mostrarErro(titulo, msg) {
      document.title = 'Jogo não encontrado — ZonaXP Publishers';
      app.innerHTML = `
        <div class="erro-pagina">
          <div class="emoji">🔍</div>
          <h2>${titulo}</h2>
          <p>${msg}</p>
        </div>
      `;
    }

    async function carregar() {
      if (!slug) {
        mostrarErro('Link inválido', 'O URL não tem um jogo.');
        return;
      }

      try {
        const resp = await fetch('/api/publico/jogo/' + encodeURIComponent(slug));
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro('Jogo não encontrado', 'Este jogo não existe ou foi removido.');
          return;
        }

        renderizar(data.jogo);

      } catch (e) {
        mostrarErro('Erro de ligação', 'Não foi possível contactar o servidor.');
      }
    }

    function renderizar(j) {
      document.title = j.nome + ' — ZonaXP Publishers';

      const heroHtml = j.imagem
        ? `<div class="hero" style="background-image:url('${escapar(j.imagem)}')"></div>`
        : `<div class="hero-placeholder">🎮</div>`;

      app.innerHTML = `
        <div class="card">
          ${heroHtml}
          <div class="conteudo">

            <div class="tag-plataforma">${escapar(j.plataforma)}</div>
            <h1>${escapar(j.nome)}</h1>
            <div class="categoria">${escapar(j.categoria)}</div>

            <div class="desc-curta">${escapar(j.descricao_curta)}</div>

            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">Tamanho</div>
                <div class="info-valor">${escapar(j.tamanho)}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Senha</div>
                <div class="info-valor">${escapar(j.senha)}</div>
              </div>
            </div>

            ${j.descricao_longa ? `
              <div class="desc-longa">
                <h3>Sobre o jogo</h3>
                <div class="desc-longa-conteudo">${escapar(j.descricao_longa)}</div>
              </div>
            ` : ''}

            <a class="btn-download" href="${escapar(j.download)}" target="_blank" rel="noopener">
              ⬇️ Descarregar
            </a>

          </div>
        </div>

        <div class="rodape">
          Publicado via <a href="/loja/zonaxp-membro" target="_blank">ZonaXP Publishers</a>
        </div>
      `;
    }

    carregar();
  </script>
</body>
</html>
