<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A carregar... — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      color: var(--texto);
      padding-bottom: 40px;
      transition: background 0.3s;
    }

    /* HEADER */
    .topo {
      background: rgba(10,10,26,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.3s;
    }
    .btn-voltar {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: var(--texto);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-voltar:hover {
      border-color: var(--primaria);
      background: rgba(255,0,170,0.1);
    }
    .topo-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--texto);
      letter-spacing: -0.2px;
      flex: 1;
      text-decoration: none;
    }
    .topo-brand span {
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    /* CONTAINER */
    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      transition: background 0.3s;
    }

    /* HERO */
    .hero {
      width: 100%;
      aspect-ratio: 1/1;
      background: #0a0a1a center/cover no-repeat;
      position: relative;
    }
    .hero-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, var(--primaria) 0%, var(--secundaria) 100%);
      opacity: 0.15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: rgba(255,255,255,0.4);
    }

    /* CONTEÚDO */
    .conteudo {
      padding: 22px 20px;
    }

    /* TAGS */
    .tags-linha {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tag {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .tag-plataforma {
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      box-shadow: 0 0 12px rgba(255,0,170,0.3);
    }
    .tag-categoria {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.25;
      margin-bottom: 10px;
      word-break: break-word;
    }

    /* LINK LOJA */
    .link-loja {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      padding: 6px 12px 6px 6px;
      border-radius: 30px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 18px;
      transition: all 0.2s;
      max-width: 100%;
    }
    .link-loja:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--secundaria);
      color: var(--secundaria);
    }
    .loja-avatar-peq {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08) center/cover no-repeat;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--primaria);
    }
    .link-loja-texto {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .link-loja-texto strong {
      color: var(--texto);
      font-weight: 700;
    }

    /* PREÇO / GRÁTIS */
    .preco-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-weight: 800;
    }
    .preco-box.gratis {
      background: rgba(0,200,80,0.1);
      border: 1.5px solid rgba(0,200,80,0.3);
      color: #66ff99;
    }
    .preco-box.pago {
      background: linear-gradient(135deg, rgba(255,0,170,0.15), rgba(0,170,255,0.15));
      border: 1.5px solid rgba(255,0,170,0.3);
      color: var(--texto);
    }
    .preco-emoji { font-size: 22px; }
    .preco-valor {
      font-size: 22px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primaria), var(--secundaria));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .preco-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* DESCRIÇÃO CURTA */
    .desc-curta {
      font-size: 14.5px;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      word-break: break-word;
    }

    /* INFO CARDS */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .info-grid.single {
      grid-template-columns: 1fr;
    }
    .info-item {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .info-label {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .info-valor {
      font-size: 15px;
      font-weight: 700;
      color: var(--texto);
      word-break: break-word;
    }

    /* DESCRIÇÃO LONGA */
    .desc-longa {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 20px;
    }
    .desc-longa h3 {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .desc-longa-conteudo {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255,255,255,0.85);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: inherit;
    }

    /* AÇÕES */
    .acoes {
      display: flex;
      gap: 8px;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .btn-like {
      background: rgba(255,0,170,0.1);
      border: 1.5px solid rgba(255,0,170,0.3);
      color: var(--primaria);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-like:hover {
      background: rgba(255,0,170,0.2);
      transform: translateY(-1px);
    }
    .btn-like:active { transform: scale(0.96); }
    .btn-like.liked {
      background: var(--primaria);
      color: #fff;
      border-color: var(--primaria);
      box-shadow: 0 0 20px rgba(255,0,170,0.4);
    }
    .btn-like .coracao {
      font-size: 15px;
      transition: transform 0.2s;
    }
    .btn-like.liked .coracao {
      animation: pulsar 0.4s;
    }
    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }

    .btn-partilhar {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: var(--texto);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-partilhar:hover {
      border-color: var(--secundaria);
      background: rgba(0,170,255,0.1);
    }
    .btn-partilhar .icone { font-size: 15px; }

    .btn-acao-principal {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 18px;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s;
      text-align: center;
      letter-spacing: -0.2px;
      font-family: inherit;
      border: none;
      cursor: pointer;
    }
    .btn-acao-principal.download {
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      box-shadow: 0 4px 16px rgba(255,0,170,0.3);
    }
    .btn-acao-principal.download:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(255,0,170,0.4);
    }
    .btn-acao-principal.comprar {
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
    }
    .btn-acao-principal.comprar:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(37,211,102,0.4);
    }

    /* ERRO */
    .erro-pagina {
      text-align: center;
      padding: 60px 20px;
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .erro-pagina .emoji {
      font-size: 56px;
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .erro-pagina h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .erro-pagina p {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
    .erro-pagina a {
      color: var(--secundaria);
      text-decoration: none;
      font-weight: 600;
    }

    /* RODAPÉ */
    .rodape {
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,0.3);
      margin-top: 24px;
      padding: 0 20px;
    }
    .rodape a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .rodape a:hover {
      color: var(--primaria);
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.4);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--primaria);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--cards);
      color: var(--texto);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s;
      z-index: 200;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    .toast.ativo { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="topo">
    <button class="btn-voltar" onclick="voltar()">←</button>
    <a class="topo-brand" href="/index.html">Publisher <span>ZonaXP</span></a>
  </div>

  <div class="container" id="app">
    <div class="loading">
      <div class="spinner"></div>
      A carregar...
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    // CONFIGURAÇÃO
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    const app = document.getElementById('app');
    let jogoAtual = null;
    let jaDeuLike = false;

    function escapar(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function aplicarCores(cores) {
      const r = document.documentElement.style;
      r.setProperty('--primaria', cores.primaria);
      r.setProperty('--secundaria', cores.secundaria);
      r.setProperty('--fundo', cores.fundo);
      r.setProperty('--cards', cores.cards);
      r.setProperty('--texto', cores.texto);
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ativo';
      setTimeout(() => t.classList.remove('ativo'), 2200);
    }

    function voltar() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = '/index.html';
      }
    }

    function mostrarErro(titulo, msg) {
      document.title = 'Item não encontrado — Publisher ZonaXP';
      app.innerHTML = `
        <div class="erro-pagina">
          <div class="emoji">🔍</div>
          <h2>${titulo}</h2>
          <p>${msg}</p>
          <p style="margin-top:14px"><a href="/index.html">← Voltar à home</a></p>
        </div>
      `;
    }

    /* ---------- Formatar preço ---------- */
    function formatarPreco(preco) {
      const n = Number(preco) || 0;
      return n.toLocaleString('pt-MZ') + ' MT';
    }

    /* ---------- Carregar ---------- */
    async function carregar() {
      if (!slug) {
        mostrarErro('Link inválido', 'O URL não tem um item.');
        return;
      }

      try {
        const resp = await fetch(API_URL + '/api/publico/jogo/' + encodeURIComponent(slug));
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro('Item não encontrado', 'Este item não existe ou foi removido.');
          return;
        }

        jogoAtual = data.jogo;
        renderizar(jogoAtual);

        const likesDados = JSON.parse(localStorage.getItem('likes_dados') || '{}');
        if (likesDados[slug]) {
          jaDeuLike = true;
          document.getElementById('btnLike').classList.add('liked');
        }

      } catch (e) {
        mostrarErro('Erro de ligação', 'Não foi possível contactar o servidor.');
      }
    }

    /* ---------- Renderizar ---------- */
    function renderizar(j) {
      document.title = j.nome + ' — Publisher ZonaXP';

      if (j.coresLoja) aplicarCores(j.coresLoja);

      const heroHtml = j.imagem
        ? `<div class="hero" style="background-image:url('${escapar(j.imagem)}')"></div>`
        : `<div class="hero-placeholder">🎮</div>`;

      const avatarLojaHtml = j.avatarLoja
        ? `<div class="loja-avatar-peq" style="background-image:url('${escapar(j.avatarLoja)}')"></div>`
        : `<div class="loja-avatar-peq">${escapar(j.nomeLoja).charAt(0).toUpperCase()}</div>`;

      // Tags (plataforma opcional)
      const tagsHtml = `
        <div class="tags-linha">
          ${j.plataforma ? `<span class="tag tag-plataforma">${escapar(j.plataforma)}</span>` : ''}
          <span class="tag tag-categoria">${escapar(j.categoria)}</span>
        </div>
      `;

      // Preço
      const isPago = j.tipo === 'pago';
      const precoHtml = isPago
        ? `
          <div class="preco-box pago">
            <span class="preco-emoji">💰</span>
            <span class="preco-valor">${formatarPreco(j.preco)}</span>
          </div>
        `
        : `
          <div class="preco-box gratis">
            <span class="preco-emoji">✅</span>
            <span class="preco-label">Grátis</span>
          </div>
        `;

      // Descrição curta (opcional)
      const descCurtaHtml = j.descricao_curta
        ? `<div class="desc-curta">${escapar(j.descricao_curta)}</div>`
        : '';

      // Info cards (tamanho/senha opcionais)
      const temTamanho = !!j.tamanho;
      const temSenha = !!j.senha;
      let infoHtml = '';
      if (temTamanho || temSenha) {
        infoHtml = `
          <div class="info-grid ${(temTamanho && temSenha) ? '' : 'single'}">
            ${temTamanho ? `
              <div class="info-item">
                <div class="info-label">Tamanho</div>
                <div class="info-valor">${escapar(j.tamanho)}</div>
              </div>
            ` : ''}
            ${temSenha ? `
              <div class="info-item">
                <div class="info-label">Senha</div>
                <div class="info-valor">${escapar(j.senha)}</div>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Descrição longa (opcional)
      const descLongaHtml = j.descricao_longa
        ? `
          <div class="desc-longa">
            <h3>Sobre</h3>
            <div class="desc-longa-conteudo">${escapar(j.descricao_longa)}</div>
          </div>
        `
        : '';

      // Botão principal (download ou whatsapp)
      let botaoPrincipalHtml = '';
      if (isPago) {
        const whatsappLoja = j.whatsappLoja || '';
        const mensagem = encodeURIComponent(`Quero comprar ${j.nome}`);
        if (whatsappLoja) {
          botaoPrincipalHtml = `
            <a class="btn-acao-principal comprar"
               href="https://wa.me/${escapar(whatsappLoja)}?text=${mensagem}"
               target="_blank" rel="noopener">
              💬 Comprar no WhatsApp
            </a>
          `;
        } else {
          botaoPrincipalHtml = `
            <div class="btn-acao-principal comprar" style="opacity:0.5;cursor:not-allowed">
              💬 Vendedor sem WhatsApp
            </div>
          `;
        }
      } else {
        botaoPrincipalHtml = `
          <a class="btn-acao-principal download"
             href="${escapar(j.download)}"
             target="_blank" rel="noopener">
            ⬇️ Descarregar
          </a>
        `;
      }

      app.innerHTML = `
        <div class="card">
          ${heroHtml}
          <div class="conteudo">

            ${tagsHtml}
            <h1>${escapar(j.nome)}</h1>

            <a class="link-loja" href="/loja.html?slug=${escapar(j.slugLoja)}">
              ${avatarLojaHtml}
              <span class="link-loja-texto">por <strong>${escapar(j.nomeLoja)}</strong></span>
              <span style="font-size:14px">→</span>
            </a>

            ${precoHtml}

            ${descCurtaHtml}
            ${infoHtml}
            ${descLongaHtml}

            <div class="acoes">
              <button class="btn-like" id="btnLike" onclick="darLike()">
                <span class="coracao">❤️</span>
                <span id="likesContador">${j.likes || 0}</span>
              </button>
              <button class="btn-partilhar" onclick="partilhar()">
                <span class="icone">🔗</span>
                Partilhar
              </button>
              ${botaoPrincipalHtml}
            </div>

          </div>
        </div>

        <div class="rodape">
          Publicado via <a href="/index.html">Publisher ZonaXP</a>
        </div>
      `;
    }

    /* ---------- Partilhar ---------- */
    async function partilhar() {
      const urlAtual = window.location.href;
      const nome = jogoAtual?.nome || 'Item';

      // Se o browser suportar Web Share API (mobile)
      if (navigator.share) {
        try {
          await navigator.share({
            title: nome + ' — Publisher ZonaXP',
            text: 'Vê este item no Publisher ZonaXP!',
            url: urlAtual,
          });
          return;
        } catch (e) {
          // Utilizador cancelou ou erro → tenta copiar
        }
      }

      // Fallback: copiar para clipboard
      try {
        await navigator.clipboard.writeText(urlAtual);
        toast('Link copiado! 📋');
      } catch (e) {
        // Fallback antigo (execCommand)
        try {
          const input = document.createElement('input');
          input.value = urlAtual;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          toast('Link copiado! 📋');
        } catch (err) {
          toast('Não foi possível copiar.');
        }
      }
    }

    /* ---------- Like ---------- */
    async function darLike() {
      if (jaDeuLike) {
        toast('Já deste like neste item.');
        return;
      }

      const btn = document.getElementById('btnLike');
      const contador = document.getElementById('likesContador');

      btn.classList.add('liked');
      contador.textContent = (parseInt(contador.textContent) || 0) + 1;
      jaDeuLike = true;

      try {
        const resp = await fetch(API_URL + '/api/publico/jogo/' + encodeURIComponent(slug) + '/like', {
          method: 'POST',
        });
        const data = await resp.json();

        if (resp.ok && data.ok) {
          contador.textContent = data.likes;

          const likesDados = JSON.parse(localStorage.getItem('likes_dados') || '{}');
          likesDados[slug] = true;
          localStorage.setItem('likes_dados', JSON.stringify(likesDados));

          toast('Obrigado pelo like! ❤️');
        } else {
          btn.classList.remove('liked');
          contador.textContent = (parseInt(contador.textContent) || 1) - 1;
          jaDeuLike = false;
          toast('Erro ao dar like.');
        }
      } catch (e) {
        btn.classList.remove('liked');
        contador.textContent = (parseInt(contador.textContent) || 1) - 1;
        jaDeuLike = false;
        toast('Erro de ligação.');
      }
    }

    carregar();
  </script>
</body>
</html>
