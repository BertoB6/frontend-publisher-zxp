<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--texto);
      position: relative;
      overflow: hidden;
    }

    /* fundo com brilho neon */
    body::before {
      content: '';
      position: fixed;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,0,170,0.15), transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,170,255,0.15), transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--cards);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-emoji {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(90deg, var(--primaria), var(--secundaria));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }

    .aviso {
      background: rgba(255,0,170,0.08);
      border: 1px solid rgba(255,0,170,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .aviso strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--primaria);
    }
    .aviso code {
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--secundaria);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(0,0,0,0.25);
      color: var(--texto);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--primaria);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,0,170,0.15);
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .campo {
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(255,0,170,0.3);
      letter-spacing: 0.3px;
    }
    button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(255,0,170,0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .erro {
      background: rgba(255,0,0,0.15);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ff8888;
      margin-bottom: 16px;
      display: none;
    }
    .erro.ativo { display: block; }

    .footer {
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,0.3);
      margin-top: 24px;
    }
    .footer a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: var(--secundaria);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-emoji">🎮</div>
      <h1>Publisher ZonaXP</h1>
      <p>Painel dos publishers</p>
    </div>

    <div class="aviso">
      <strong>🔑 Credenciais (Fase 1):</strong>
      Nome: <code>ZonaXP Membro</code><br>
      Senha: <code>Editor.Jogos</code>
    </div>

    <div class="erro" id="erro"></div>

    <form id="formLogin">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="ZonaXP Membro" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <div class="footer">
      <a href="/">← Voltar ao mercado</a>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO — URL da API
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const form = document.getElementById('formLogin');
    const nomeInput = document.getElementById('nome');
    const senhaInput = document.getElementById('senha');
    const btnEntrar = document.getElementById('btnEntrar');
    const erroBox = document.getElementById('erro');

    // Se já tem token válido → vai direto para o painel
    const tokenGuardado = localStorage.getItem('publisher_token');
    if (tokenGuardado) {
      window.location.href = '/painel';
    }

    function mostrarErro(msg) {
      erroBox.textContent = msg;
      erroBox.classList.add('ativo');
    }
    function esconderErro() {
      erroBox.classList.remove('ativo');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderErro();

      const nome = nomeInput.value.trim();
      const senha = senhaInput.value;

      if (!nome || !senha) {
        mostrarErro('Preenche os dois campos.');
        return;
      }

      btnEntrar.disabled = true;
      btnEntrar.textContent = 'A entrar...';

      try {
        const resp = await fetch(API_URL + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, senha }),
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro(data.erro || 'Credenciais inválidas.');
          btnEntrar.disabled = false;
          btnEntrar.textContent = 'Entrar';
          return;
        }

        localStorage.setItem('publisher_token', data.token);
        localStorage.setItem('publisher_nome', data.publisher.nome);
        localStorage.setItem('publisher_slug', data.publisher.slug);

        window.location.href = '/painel';

      } catch (err) {
        mostrarErro('Erro de ligação ao servidor.');
        btnEntrar.disabled = false;
        btnEntrar.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
