<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--texto);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,0,170,0.15), transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,170,255,0.15), transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--cards);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-emoji {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(90deg, var(--primaria), var(--secundaria));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }

    .campo {
      margin-bottom: 16px;
    }

    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(0,0,0,0.25);
      color: var(--texto);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--primaria);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,0,170,0.15);
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .input-senha {
      padding-right: 46px !important;
    }
    .btn-olho {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s;
      line-height: 1;
    }
    .btn-olho:hover {
      color: var(--secundaria);
    }

    button.btn-principal {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(255,0,170,0.3);
      letter-spacing: 0.3px;
    }
    button.btn-principal:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(255,0,170,0.4);
    }
    button.btn-principal:active {
      transform: translateY(0);
    }
    button.btn-principal:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .erro {
      background: rgba(255,0,0,0.15);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ff8888;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .erro.ativo { display: block; }

    .sucesso {
      background: rgba(0,200,80,0.12);
      border: 1px solid rgba(0,200,80,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #66ff99;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .sucesso.ativo { display: block; }

    .footer {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 22px;
    }
    .footer a {
      color: var(--secundaria);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: var(--primaria);
    }

    .rodape-voltar {
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,0.3);
      margin-top: 18px;
    }
    .rodape-voltar a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .rodape-voltar a:hover {
      color: var(--secundaria);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-emoji">🎮</div>
      <h1>Publisher ZonaXP</h1>
      <p>Entra na tua conta</p>
    </div>

    <div class="erro" id="erro"></div>
    <div class="sucesso" id="sucesso"></div>

    <form id="formLogin">
      <div class="campo">
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" placeholder="Ex: 841234567" autocomplete="tel" inputmode="numeric" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" class="input-senha" required>
          <button type="button" class="btn-olho" onclick="toggleSenha('senha', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-principal" id="btnEntrar">Entrar</button>
    </form>

    <div class="footer">
      Ainda não tens conta? <a href="/registo.html">Regista-te</a>
    </div>

    <div class="rodape-voltar">
      <a href="/index.html">← Voltar ao mercado</a>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const form = document.getElementById('formLogin');
    const whatsappInput = document.getElementById('whatsapp');
    const senhaInput = document.getElementById('senha');
    const btnEntrar = document.getElementById('btnEntrar');
    const erroBox = document.getElementById('erro');
    const sucessoBox = document.getElementById('sucesso');

    // Se já tem token → redireciona conforme o role
    const tokenExistente = localStorage.getItem('publisher_token');
    if (tokenExistente) {
      const role = localStorage.getItem('publisher_role') || 'user';
      window.location.href = (role === 'admin') ? '/admin.html' : '/painel.html';
    }

    /* ---------- Query strings (?wpp=...&novo=1) ---------- */
    const params = new URLSearchParams(window.location.search);
    const wppParam = params.get('wpp');
    const novoParam = params.get('novo');

    if (wppParam) {
      whatsappInput.value = wppParam.replace(/\D/g, '');
    }
    if (novoParam === '1') {
      sucessoBox.textContent = '✅ Conta criada! Entra com os teus dados.';
      sucessoBox.classList.add('ativo');
    }

    /* ---------- Mostrar/ocultar senha ---------- */
    function toggleSenha(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    /* ---------- Erros ---------- */
    function mostrarErro(msg) {
      erroBox.textContent = msg;
      erroBox.classList.add('ativo');
      sucessoBox.classList.remove('ativo');
    }
    function esconderErros() {
      erroBox.classList.remove('ativo');
    }

    /* ---------- Normalizar WhatsApp ---------- */
    whatsappInput.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    /* ---------- Submeter ---------- */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderErros();

      const whatsapp = whatsappInput.value.trim();
      const senha = senhaInput.value;

      if (!whatsapp || !senha) {
        mostrarErro('Preenche o WhatsApp e a senha.');
        return;
      }
      if (whatsapp.length < 9) {
        mostrarErro('WhatsApp inválido.');
        return;
      }

      btnEntrar.disabled = true;
      btnEntrar.textContent = 'A entrar...';

      try {
        const resp = await fetch(API_URL + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ whatsapp, senha }),
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro(data.erro || 'WhatsApp ou senha errados.');
          btnEntrar.disabled = false;
          btnEntrar.textContent = 'Entrar';
          return;
        }

        // Guardar dados
        localStorage.setItem('publisher_token', data.token);
        localStorage.setItem('publisher_nome', data.publisher.nome);
        localStorage.setItem('publisher_slug', data.publisher.slug);
        localStorage.setItem('publisher_id', String(data.publisher.id));
        localStorage.setItem('publisher_whatsapp', data.publisher.whatsapp);
        localStorage.setItem('publisher_role', data.publisher.role || 'user');
        localStorage.setItem('publisher_tipo', data.publisher.tipo || 'comprador');

        // Redirecionar conforme o role
        if (data.publisher.role === 'admin') {
          window.location.href = '/admin.html';
        } else if (data.publisher.tipo === 'publisher') {
          window.location.href = '/painel.html';
        } else {
          // Comprador (sem painel ainda) → vai à home
          window.location.href = '/index.html';
        }

      } catch (err) {
        mostrarErro('Erro de ligação ao servidor.');
        btnEntrar.disabled = false;
        btnEntrar.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
