<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A carregar... — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      color: var(--texto);
      padding-bottom: 40px;
      transition: background 0.3s;
    }

    /* TOPO */
    .topo {
      background: rgba(10,10,26,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .btn-voltar {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: var(--texto);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-voltar:hover {
      border-color: var(--primaria);
      background: rgba(255,0,170,0.1);
    }
    .topo-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--texto);
      letter-spacing: -0.2px;
    }
    .topo-brand span {
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    /* CONTAINER */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* CABEÇALHO LOJA */
    .loja-header {
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      margin-bottom: 24px;
      transition: background 0.3s;
    }
    .loja-capa {
      height: 140px;
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .loja-corpo {
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .loja-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06) center/cover no-repeat;
      border: 4px solid var(--cards);
      flex-shrink: 0;
      margin-top: -56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--primaria);
      position: relative;
      z-index: 1;
    }
    .loja-info {
      flex: 1;
      min-width: 0;
    }
    .loja-nome {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .loja-bio {
      font-size: 13.5px;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .loja-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: rgba(255,255,255,0.55);
    }
    .loja-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }
    .loja-meta-item .icone {
      color: var(--primaria);
    }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37,211,102,0.12);
      color: #25d366;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid rgba(37,211,102,0.25);
      transition: all 0.15s;
      margin-top: 4px;
    }
    .btn-whatsapp:hover {
      background: rgba(37,211,102,0.2);
      transform: translateY(-1px);
    }

    /* SECÇÃO PRODUTOS */
    .secao-titulo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 14px;
      padding-left: 4px;
    }
    .secao-titulo .contador {
      background: rgba(255,0,170,0.15);
      color: var(--primaria);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    /* GRELHA */
    .grelha {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }
    @media (max-width: 480px) {
      .grelha {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }

    /* CARD JOGO */
    .card-jogo {
      background: var(--cards);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .card-jogo:hover {
      border-color: var(--primaria);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1/1;
      background: #0a0a1a center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(255,255,255,0.15);
      position: relative;
    }
    .card-tag-plataforma {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--secundaria);
      text-transform: uppercase;
    }
    .card-info {
      padding: 11px 12px 12px;
    }
    .card-nome {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 35px;
    }
    .card-likes {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      padding: 3px 7px;
      background: rgba(255,0,170,0.1);
      border-radius: 6px;
    }
    .card-likes .coracao { font-size: 10px; }

    /* VAZIO */
    .vazio {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.4);
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .vazio-emoji {
      font-size: 56px;
      margin-bottom: 14px;
      opacity: 0.5;
    }
    .vazio-titulo {
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .vazio-txt {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* ERRO */
    .erro-pagina {
      text-align: center;
      padding: 60px 20px;
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .erro-pagina .emoji {
      font-size: 56px;
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .erro-pagina h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .erro-pagina p {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
    .erro-pagina a {
      color: var(--secundaria);
      text-decoration: none;
      font-weight: 600;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.4);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--primaria);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* RODAPÉ */
    .rodape {
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,0.3);
      margin-top: 40px;
    }
    .rodape a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .rodape a:hover {
      color: var(--primaria);
    }
  </style>
</head>
<body>

  <div class="topo">
    <button class="btn-voltar" onclick="voltar()">←</button>
    <div class="topo-brand">Publisher <span>ZonaXP</span></div>
  </div>

  <div class="container" id="app">
    <div class="loading">
      <div class="spinner"></div>
      A carregar loja...
    </div>
  </div>

  <div class="rodape">
    Publicado via <a href="/">Publisher ZonaXP</a>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const partes = window.location.pathname.split('/').filter(Boolean);
    const slug = partes[partes.length - 1];

    const app = document.getElementById('app');

    function escapar(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function aplicarCores(cores) {
      const r = document.documentElement.style;
      r.setProperty('--primaria', cores.primaria);
      r.setProperty('--secundaria', cores.secundaria);
      r.setProperty('--fundo', cores.fundo);
      r.setProperty('--cards', cores.cards);
      r.setProperty('--texto', cores.texto);
    }

    function voltar() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    function mostrarErro(titulo, msg) {
      document.title = 'Loja não encontrada — Publisher ZonaXP';
      app.innerHTML = `
        <div class="erro-pagina">
          <div class="emoji">🔍</div>
          <h2>${titulo}</h2>
          <p>${msg}</p>
          <p style="margin-top:14px"><a href="/">← Voltar à home</a></p>
        </div>
      `;
    }

    async function carregar() {
      if (!slug) {
        mostrarErro('Link inválido', 'O URL não tem uma loja.');
        return;
      }

      try {
        const resp = await fetch(API_URL + '/api/publico/loja/' + encodeURIComponent(slug));
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro('Loja não encontrada', 'Esta loja não existe.');
          return;
        }

        renderizar(data.loja, data.jogos);
      } catch (e) {
        mostrarErro('Erro de ligação', 'Não foi possível contactar o servidor.');
      }
    }

    function renderizar(loja, jogos) {
      document.title = loja.nome + ' — Publisher ZonaXP';

      // Aplicar cores da loja
      if (loja.cores) aplicarCores(loja.cores);

      const capaStyle = loja.capa
        ? `background-image:url('${escapar(loja.capa)}');background-size:cover;background-position:center;`
        : '';

      const avatarHtml = loja.avatar
        ? `<div class="loja-avatar" style="background-image:url('${escapar(loja.avatar)}')"></div>`
        : `<div class="loja-avatar">${escapar(loja.nome).charAt(0).toUpperCase()}</div>`;

      const bioHtml = loja.bio ? `<div class="loja-bio">${escapar(loja.bio)}</div>` : '';

      const whatsappHtml = loja.whatsapp
        ? `<a class="btn-whatsapp" href="https://wa.me/${escapar(loja.whatsapp)}" target="_blank" rel="noopener">
             💬 WhatsApp
           </a>`
        : '';

      const produtosHtml = jogos.length === 0
        ? `<div class="vazio">
             <div class="vazio-emoji">📦</div>
             <div class="vazio-titulo">Ainda sem produtos</div>
             <div class="vazio-txt">Esta loja ainda não publicou nada.</div>
           </div>`
        : `<div class="grelha">${jogos.map(j => renderCard(j)).join('')}</div>`;

      app.innerHTML = `
        <div class="loja-header">
          <div class="loja-capa" style="${capaStyle}"></div>
          <div class="loja-corpo">
            ${avatarHtml}
            <div class="loja-info">
              <div class="loja-nome">${escapar(loja.nome)}</div>
              ${bioHtml}
              <div class="loja-meta">
                <div class="loja-meta-item">
                  <span class="icone">📦</span>
                  <span>${jogos.length} ${jogos.length === 1 ? 'jogo' : 'jogos'}</span>
                </div>
                ${whatsappHtml}
              </div>
            </div>
          </div>
        </div>

        <div class="secao-titulo">
          Produtos
          <span class="contador">${jogos.length}</span>
        </div>

        ${produtosHtml}
      `;
    }

    function renderCard(j) {
      const imgHtml = j.imagem
        ? `<div class="card-img" style="background-image:url('${escapar(j.imagem)}')"></div>`
        : `<div class="card-img">🎮</div>`;

      return `
        <div class="card-jogo" onclick="irParaJogo('${escapar(j.slug)}')">
          ${imgHtml}
          <div class="card-tag-plataforma">${escapar(j.plataforma)}</div>
          <div class="card-info">
            <div class="card-nome">${escapar(j.nome)}</div>
            <div class="card-likes">
              <span class="coracao">❤️</span>
              <span>${j.likes || 0}</span>
            </div>
          </div>
        </div>
      `;
    }

    function irParaJogo(slug) {
      window.location.href = '/jogo/' + slug;
    }

    carregar();
  </script>
</body>
</html>
