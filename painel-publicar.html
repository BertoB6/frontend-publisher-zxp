<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Jogo — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      color: var(--texto);
      padding-bottom: 60px;
    }

    /* HEADER */
    header {
      background: rgba(10,10,26,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .btn-voltar {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: var(--texto);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-voltar:hover {
      border-color: var(--primaria);
      background: rgba(255,0,170,0.1);
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* CONTAINER */
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: var(--cards);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 22px 20px;
    }

    /* CAMPOS */
    .campo {
      margin-bottom: 18px;
    }
    .campo:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    label .obrig { color: var(--primaria); margin-left: 2px; }
    label .opc {
      color: rgba(255,255,255,0.35);
      font-weight: 400;
      font-size: 11px;
      margin-left: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 14.5px;
      background: rgba(0,0,0,0.25);
      color: var(--texto);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primaria);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,0,170,0.15);
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }
    textarea.longa {
      min-height: 160px;
      font-family: inherit;
    }
    select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 40px;
    }
    select option {
      background: var(--cards);
      color: var(--texto);
    }

    /* GRID 2 COLUNAS */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 480px) {
      .grid2 { grid-template-columns: 1fr; gap: 0; }
      .grid2 .campo { margin-bottom: 18px; }
    }

    /* PREVIEW IMAGEM */
    .preview {
      margin-top: 10px;
      width: 100%;
      aspect-ratio: 1/1;
      max-width: 120px;
      border-radius: 10px;
      border: 1.5px dashed rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      text-align: center;
      padding: 10px;
    }
    .preview.tem-img {
      border-style: solid;
      border-color: rgba(255,255,255,0.1);
    }

    /* DICA */
    .dica {
      font-size: 11.5px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      padding-left: 2px;
      line-height: 1.4;
    }

    /* BOTÕES */
    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .acoes button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: all 0.15s;
    }
    .btn-cancelar {
      background: rgba(255,255,255,0.08);
      color: var(--texto);
    }
    .btn-cancelar:hover {
      background: rgba(255,255,255,0.15);
    }
    .btn-guardar {
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,0,170,0.3);
    }
    .btn-guardar:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-guardar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    /* ERRO */
    .erro {
      background: rgba(255,0,0,0.15);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ff8888;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .erro.ativo { display: block; }
    .erro ul {
      margin-left: 16px;
      margin-top: 6px;
    }
    .erro li { margin-bottom: 2px; }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.4);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--primaria);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--cards);
      color: var(--texto);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s;
      z-index: 200;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toast.ativo { transform: translateX(-50%) translateY(0); }
    .toast.erro { background: #d00; border-color: #d00; }
  </style>
</head>
<body>

  <header>
    <button class="btn-voltar" onclick="window.location.href='/painel.html'">←</button>
    <h1 id="titulo">Publicar novo jogo</h1>
  </header>

  <div class="container">
    <div class="card" id="card">

      <div class="erro" id="erro"></div>

      <form id="formJogo">

        <div class="campo">
          <label>Nome do jogo <span class="obrig">*</span></label>
          <input type="text" id="nome" placeholder="Ex: Mortal Kombat Mod" required>
        </div>

        <div class="grid2">
          <div class="campo">
            <label>Categoria <span class="obrig">*</span></label>
            <input type="text" id="categoria" placeholder="Ex: Luta" required>
          </div>
          <div class="campo">
            <label>Plataforma <span class="obrig">*</span></label>
            <select id="plataforma" required>
              <option value="">Escolher...</option>
              <option value="PSP">PSP</option>
              <option value="PS2">PS2</option>
              <option value="PC">PC</option>
              <option value="APK">APK</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label>URL da imagem <span class="obrig">*</span></label>
          <input type="url" id="imagem" placeholder="https://..." required oninput="atualizarPreview()">
          <div class="preview" id="preview">Sem imagem</div>
        </div>

        <div class="grid2">
          <div class="campo">
            <label>Tamanho <span class="obrig">*</span></label>
            <input type="text" id="tamanho" placeholder="Ex: 1.2 GB" required>
          </div>
          <div class="campo">
            <label>Senha <span class="obrig">*</span></label>
            <input type="text" id="senha" placeholder="Ex: 1234" required>
          </div>
        </div>

        <div class="campo">
          <label>Link de download <span class="obrig">*</span></label>
          <input type="url" id="download" placeholder="https://mega.nz/..." required>
        </div>

        <div class="campo">
          <label>Descrição curta <span class="obrig">*</span></label>
          <textarea id="descricao_curta" placeholder="Uma linha rápida sobre o jogo." maxlength="200" required></textarea>
          <div class="dica">Máximo 200 caracteres. Aparece nos cards do mercado.</div>
        </div>

        <div class="campo">
          <label>Descrição longa <span class="obrig">*</span></label>
          <textarea id="descricao_longa" class="longa" placeholder="Descrição completa.&#10;&#10;- Podes usar várias linhas&#10;- Listas com hífens&#10;- Quebras de linha são preservadas" required></textarea>
          <div class="dica">Aceita várias linhas. As quebras de linha são preservadas.</div>
        </div>

        <div class="acoes">
          <button type="button" class="btn-cancelar" onclick="window.location.href='/painel.html'">Cancelar</button>
          <button type="submit" class="btn-guardar" id="btnGuardar">Publicar</button>
        </div>

      </form>
    </div>

    <div id="loadingContainer" style="display:none">
      <div class="loading">
        <div class="spinner"></div>
        A carregar jogo...
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    // CONFIGURAÇÃO
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const TOKEN = localStorage.getItem('publisher_token');
    if (!TOKEN) window.location.href = '/login.html';

    // Modo edição?
    const params = new URLSearchParams(window.location.search);
    const jogoId = params.get('id');
    const modoEdicao = !!jogoId;

    if (modoEdicao) {
      document.getElementById('titulo').textContent = 'Editar jogo';
      document.getElementById('btnGuardar').textContent = 'Guardar alterações';
    }

    const form = document.getElementById('formJogo');
    const card = document.getElementById('card');
    const loadingContainer = document.getElementById('loadingContainer');

    /* ---------- Toast ---------- */
    function toast(msg, erro = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ativo' + (erro ? ' erro' : '');
      setTimeout(() => t.classList.remove('ativo'), 2500);
    }

    /* ---------- Erro ---------- */
    function mostrarErro(msg, lista) {
      const box = document.getElementById('erro');
      let html = msg;
      if (lista && lista.length) {
        html += '<ul>' + lista.map(f => `<li>${f}</li>`).join('') + '</ul>';
      }
      box.innerHTML = html;
      box.classList.add('ativo');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function esconderErro() {
      document.getElementById('erro').classList.remove('ativo');
    }

    /* ---------- Preview imagem ---------- */
    function atualizarPreview() {
      const url = document.getElementById('imagem').value.trim();
      const box = document.getElementById('preview');
      if (!url) {
        box.textContent = 'Sem imagem';
        box.classList.remove('tem-img');
        box.style.backgroundImage = '';
        return;
      }
      const img = new Image();
      img.onload = () => {
        box.textContent = '';
        box.classList.add('tem-img');
        box.style.backgroundImage = `url('${url}')`;
      };
      img.onerror = () => {
        box.textContent = 'Imagem inválida';
        box.classList.remove('tem-img');
        box.style.backgroundImage = '';
      };
      img.src = url;
    }

    /* ---------- Carregar jogo (edição) ---------- */
    async function carregarJogo() {
      card.style.display = 'none';
      loadingContainer.style.display = 'block';

      try {
        const resp = await fetch(API_URL + '/api/jogos/' + jogoId, {
          headers: { 'Authorization': 'Bearer ' + TOKEN }
        });

        if (resp.status === 401) {
          localStorage.clear();
          window.location.href = '/login.html';
          return;
        }

        const data = await resp.json();
        if (!resp.ok) {
          toast(data.erro || 'Jogo não encontrado.', true);
          setTimeout(() => window.location.href = '/painel.html', 1500);
          return;
        }

        const j = data.jogo;
        document.getElementById('nome').value = j.nome || '';
        document.getElementById('categoria').value = j.categoria || '';
        document.getElementById('plataforma').value = j.plataforma || '';
        document.getElementById('imagem').value = j.imagem || '';
        document.getElementById('tamanho').value = j.tamanho || '';
        document.getElementById('senha').value = j.senha || '';
        document.getElementById('download').value = j.download || '';
        document.getElementById('descricao_curta').value = j.descricao_curta || '';
        document.getElementById('descricao_longa').value = j.descricao_longa || '';

        atualizarPreview();

      } catch (e) {
        toast('Erro a carregar o jogo.', true);
      } finally {
        card.style.display = 'block';
        loadingContainer.style.display = 'none';
      }
    }

    /* ---------- Submeter ---------- */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderErro();

      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.textContent = modoEdicao ? 'A guardar...' : 'A publicar...';

      const dados = {
        nome: document.getElementById('nome').value.trim(),
        categoria: document.getElementById('categoria').value.trim(),
        plataforma: document.getElementById('plataforma').value,
        imagem: document.getElementById('imagem').value.trim(),
        tamanho: document.getElementById('tamanho').value.trim(),
        senha: document.getElementById('senha').value.trim(),
        download: document.getElementById('download').value.trim(),
        descricao_curta: document.getElementById('descricao_curta').value.trim(),
        descricao_longa: document.getElementById('descricao_longa').value,
      };

      try {
        const url = modoEdicao ? API_URL + '/api/jogos/' + jogoId : API_URL + '/api/jogos';
        const metodo = modoEdicao ? 'PUT' : 'POST';

        const resp = await fetch(url, {
          method: metodo,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + TOKEN,
          },
          body: JSON.stringify(dados),
        });

        const data = await resp.json();

        if (!resp.ok) {
          if (data.faltam) {
            mostrarErro('Preenche todos os campos obrigatórios:', data.faltam);
          } else {
            mostrarErro(data.erro || 'Erro ao guardar.');
          }
          btn.disabled = false;
          btn.textContent = modoEdicao ? 'Guardar alterações' : 'Publicar';
          return;
        }

        toast(modoEdicao ? 'Alterações guardadas!' : 'Jogo publicado!');
        setTimeout(() => window.location.href = '/painel.html', 800);

      } catch (err) {
        mostrarErro('Erro de ligação ao servidor.');
        btn.disabled = false;
        btn.textContent = modoEdicao ? 'Guardar alterações' : 'Publicar';
      }
    });

    /* ---------- Iniciar ---------- */
    if (modoEdicao) carregarJogo();
  </script>
</body>
</html>
