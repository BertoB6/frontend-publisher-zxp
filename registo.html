<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Publisher ZonaXP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primaria: #ff00aa;
      --secundaria: #00aaff;
      --fundo: #0a0a1a;
      --cards: #15152a;
      --texto: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--fundo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--texto);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,0,170,0.15), transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,170,255,0.15), transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--cards);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-emoji {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(90deg, var(--primaria), var(--secundaria));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }

    .info {
      background: rgba(0,170,255,0.08);
      border: 1px solid rgba(0,170,255,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .info strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--secundaria);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    label .obrig { color: var(--primaria); margin-left: 2px; }

    .campo {
      margin-bottom: 16px;
    }

    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(0,0,0,0.25);
      color: var(--texto);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--primaria);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,0,170,0.15);
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    /* Input com botão olho */
    .input-senha {
      padding-right: 46px !important;
    }
    .btn-olho {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s;
      line-height: 1;
    }
    .btn-olho:hover {
      color: var(--secundaria);
    }

    .dica {
      font-size: 11.5px;
      color: rgba(255,255,255,0.4);
      margin-top: 5px;
      padding-left: 2px;
    }

    button.btn-principal {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primaria), var(--secundaria));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(255,0,170,0.3);
      letter-spacing: 0.3px;
    }
    button.btn-principal:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(255,0,170,0.4);
    }
    button.btn-principal:active {
      transform: translateY(0);
    }
    button.btn-principal:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .erro {
      background: rgba(255,0,0,0.15);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ff8888;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .erro.ativo { display: block; }

    .sucesso {
      background: rgba(0,200,80,0.12);
      border: 1px solid rgba(0,200,80,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #66ff99;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .sucesso.ativo { display: block; }

    .footer {
      text-align: center;
      font-size: 12.5px;
      color: rgba(255,255,255,0.4);
      margin-top: 22px;
    }
    .footer a {
      color: var(--secundaria);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: var(--primaria);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-emoji">🎮</div>
      <h1>Criar conta</h1>
      <p>Junta-te ao mercado Publisher ZonaXP</p>
    </div>

    <div class="info">
      <strong>💡 Como funciona:</strong>
      Assim que criares conta, tens a tua loja própria automaticamente.
      Só precisas de um nome, WhatsApp e uma senha.
    </div>

    <div class="erro" id="erro"></div>
    <div class="sucesso" id="sucesso"></div>

    <form id="formRegisto">

      <div class="campo">
        <label for="nome">Nome da loja <span class="obrig">*</span></label>
        <input type="text" id="nome" placeholder="Ex: João Games" autocomplete="organization" required>
        <div class="dica">Este é o nome que os visitantes vão ver.</div>
      </div>

      <div class="campo">
        <label for="whatsapp">WhatsApp <span class="obrig">*</span></label>
        <input type="tel" id="whatsapp" placeholder="Ex: 841234567" autocomplete="tel" inputmode="numeric" required>
        <div class="dica">Usado para entrar na conta.</div>
      </div>

      <div class="campo">
        <label for="senha">Senha <span class="obrig">*</span></label>
        <div class="input-wrap">
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" class="input-senha" required>
          <button type="button" class="btn-olho" onclick="toggleSenha('senha', this)">👁️</button>
        </div>
      </div>

      <div class="campo">
        <label for="senha2">Confirmar senha <span class="obrig">*</span></label>
        <div class="input-wrap">
          <input type="password" id="senha2" placeholder="Repete a senha" autocomplete="new-password" class="input-senha" required>
          <button type="button" class="btn-olho" onclick="toggleSenha('senha2', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-principal" id="btnRegistar">Criar conta</button>
    </form>

    <div class="footer">
      Já tens conta? <a href="/login.html">Entrar</a>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO
    // ============================================
    const API_URL = 'https://publisher-zonaxp.onrender.com';

    const form = document.getElementById('formRegisto');
    const nomeInput = document.getElementById('nome');
    const whatsappInput = document.getElementById('whatsapp');
    const senhaInput = document.getElementById('senha');
    const senha2Input = document.getElementById('senha2');
    const btnRegistar = document.getElementById('btnRegistar');
    const erroBox = document.getElementById('erro');
    const sucessoBox = document.getElementById('sucesso');

    // Se já tem token → vai para o painel
    if (localStorage.getItem('publisher_token')) {
      window.location.href = '/painel.html';
    }

    /* ---------- Mostrar/ocultar senha ---------- */
    function toggleSenha(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    /* ---------- Mostrar erros/sucesso ---------- */
    function mostrarErro(msg) {
      erroBox.textContent = msg;
      erroBox.classList.add('ativo');
      sucessoBox.classList.remove('ativo');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function mostrarSucesso(msg) {
      sucessoBox.textContent = msg;
      sucessoBox.classList.add('ativo');
      erroBox.classList.remove('ativo');
    }
    function esconder() {
      erroBox.classList.remove('ativo');
      sucessoBox.classList.remove('ativo');
    }

    /* ---------- Normalizar WhatsApp (só dígitos) ---------- */
    whatsappInput.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    /* ---------- Submeter ---------- */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconder();

      const nome = nomeInput.value.trim();
      const whatsapp = whatsappInput.value.trim();
      const senha = senhaInput.value;
      const senha2 = senha2Input.value;

      // Validações no cliente
      if (!nome || nome.length < 3) {
        mostrarErro('O nome da loja tem que ter pelo menos 3 caracteres.');
        return;
      }
      if (!whatsapp || whatsapp.length < 9) {
        mostrarErro('O WhatsApp tem que ter pelo menos 9 dígitos.');
        return;
      }
      if (senha.length < 6) {
        mostrarErro('A senha tem que ter pelo menos 6 caracteres.');
        return;
      }
      if (senha !== senha2) {
        mostrarErro('As senhas não coincidem.');
        return;
      }

      btnRegistar.disabled = true;
      btnRegistar.textContent = 'A criar conta...';

      try {
        const resp = await fetch(API_URL + '/api/publisher/registar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, whatsapp, senha }),
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mostrarErro(data.erro || 'Erro ao criar conta.');
          btnRegistar.disabled = false;
          btnRegistar.textContent = 'Criar conta';
          return;
        }

        // Sucesso
        mostrarSucesso('Conta criada com sucesso! A redirecionar para o login...');
        btnRegistar.textContent = 'Conta criada!';

        // Redirecionar para o login com o whatsapp pré-preenchido
        setTimeout(() => {
          window.location.href = '/login.html?wpp=' + encodeURIComponent(whatsapp) + '&novo=1';
        }, 1500);

      } catch (err) {
        mostrarErro('Erro de ligação ao servidor. Tenta novamente.');
        btnRegistar.disabled = false;
        btnRegistar.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
